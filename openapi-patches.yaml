# OpenAPI Specification Patches
#
# This file contains patches to work around inconsistencies between the
# Bitbucket Cloud OpenAPI specification and the actual API behavior.
#
# Each patch is applied to the OpenAPI spec before code generation.
patches:
  - name: "Fix comment_resolution required type field"
    reason: |
      The API returns empty objects {} without the 'type' field for comments
      that don't have a resolution, but the OpenAPI spec declares 'type' as
      required. This causes deserialization errors.

      Issue: "error: parse error during list pull request comments: missing
      field `type` at line 1 column 4643"
    type: "make_field_optional"
    schema: "comment_resolution"
    field: "type"

  - name: "Fix object required type field"
    reason: |
      The API returns parent comment objects without the 'type' field. Parent
      comments in pullrequest_comment.parent only include 'id' and 'links'
      fields, but they inherit from 'object' schema which declares 'type' as
      required with a discriminator. Making the discriminator optional allows
      deserialization of partial objects.

      Issue: "error: parse error during list pull request comments pagination:
      missing field `type` at line 1 column 40305"
    type: "make_field_optional"
    schema: "object"
    field: "type"

  - name: "Add discriminator mapping for pipeline_target"
    reason: |
      The OpenAPI spec defines pipeline_target with a discriminator on the
      'type' field, but doesn't map discriminator values to concrete types.
      This prevents the code generator from properly supporting polymorphic
      deserialization of pipeline targets (pipeline_ref_target,
      pipeline_commit_target, etc.).

      Adding the discriminator mapping allows the SDK to properly deserialize
      and serialize pipeline target variants based on the 'type' field value.
      This enables using the SDK method create_pipeline_for_repository instead
      of bypassing with raw HTTP requests.
    type: "add_discriminator_mapping"
    schema: "pipeline_target"
    propertyName: "type"
    mapping:
      "pipeline_ref_target": "#/components/schemas/pipeline_ref_target"
      "pipeline_commit_target": "#/components/schemas/pipeline_commit_target"

  - name: "Flatten pipeline_ref_target schema"
    reason: |
      The pipeline_ref_target uses allOf inheritance from pipeline_target,
      which causes the Rust code generator to create enum variants without
      fields. Flattening the schema to explicitly include all properties
      (ref_type, ref_name, commit, selector) allows the generator to include
      these fields in the enum variant, making it usable for serialization.

      This enables using the SDK's create_pipeline_for_repository method
      directly instead of bypassing with raw HTTP requests.
    type: "flatten_schema"
    schema: "pipeline_ref_target"
    baseSchema: "pipeline_target"

  - name: "Remove discriminator from flattened pipeline_ref_target"
    reason: |
      After flattening, pipeline_ref_target should be a concrete struct, not a
      discriminated union. The discriminator was inherited from the base
      pipeline_target schema during flattening, but it shouldn't be there. If
      left, it causes the generator to create a nested tagged enum which fails
      deserialization when the parent already handles the discriminator.
    type: "remove_schema_discriminator"
    schema: "pipeline_ref_target"

  - name: "Flatten pipeline_commit_target schema"
    reason: |
      Similar to pipeline_ref_target, flatten pipeline_commit_target to
      include all properties (commit, selector) in the enum variant.
    type: "flatten_schema"
    schema: "pipeline_commit_target"
    baseSchema: "pipeline_target"

  - name: "Remove discriminator from flattened pipeline_commit_target"
    reason: |
      After flattening, pipeline_commit_target should be a concrete struct, not a
      discriminated union. The discriminator was inherited from the base
      pipeline_target schema during flattening, but it shouldn't be there.
    type: "remove_schema_discriminator"
    schema: "pipeline_commit_target"

  - name: "Flatten pipeline_pullrequest_target schema"
    reason: |
      Similar to pipeline_ref_target and pipeline_commit_target, flatten
      pipeline_pullrequest_target to include all properties from the base schema.
    type: "flatten_schema"
    schema: "pipeline_pullrequest_target"
    baseSchema: "pipeline_target"

  - name: "Remove discriminator from flattened pipeline_pullrequest_target"
    reason: |
      After flattening, pipeline_pullrequest_target should be a concrete struct, not a
      discriminated union. The discriminator was inherited from the base
      pipeline_target schema during flattening, but it shouldn't be there.
    type: "remove_schema_discriminator"
    schema: "pipeline_pullrequest_target"

  - name: "Add pull-requests to pipeline_selector type enum"
    reason: |
      The Bitbucket API can return pipelines with selector type "pull-requests" but
      the OpenAPI spec only includes "branches", "tags", "bookmarks", "default", and "custom".
      Add "pull-requests" to the enum so deserialization doesn't fail.
    type: "add_enum_value"
    schema: "pipeline_selector"
    property: "type"
    value: "pull-requests"

  - name: "Fix pipeline_trigger required type field"
    reason: |
      Similar to comment_resolution and parent comments, the API returns
      pipeline_trigger objects without the 'type' discriminator field. The
      schema inherits from 'object' which declares 'type' as required, causing
      deserialization errors when the API response lacks it.

      Make the discriminator optional for pipeline_trigger and related types
      so partial objects can be deserialized.
    type: "make_field_optional"
    schema: "pipeline_trigger"
    field: "type"

  - name: "Fix pipeline_state required type field"
    reason: |
      Similar issue to pipeline_trigger - the pipeline_state inherits from
      object with a required type discriminator, but API responses may not
      include it.
    type: "make_field_optional"
    schema: "pipeline_state"
    field: "type"

  - name: "Fix pipeline_state_in_progress_stage required type field"
    reason: |
      Nested state object that may lack the type discriminator.
    type: "make_field_optional"
    schema: "pipeline_state_in_progress_stage"
    field: "type"

  - name: "Fix pipeline_state_completed_result required type field"
    reason: |
      Nested state object that may lack the type discriminator.
    type: "make_field_optional"
    schema: "pipeline_state_completed_result"
    field: "type"

  - name: "Fix pipeline_error required type field"
    reason: |
      Nested error object that may lack the type discriminator.
    type: "make_field_optional"
    schema: "pipeline_error"
    field: "type"

  - name: "Fix repository required type field"
    reason: |
      Pipeline.repository field may return objects without type discriminator.
    type: "make_field_optional"
    schema: "repository"
    field: "type"

  - name: "Fix account required type field"
    reason: |
      Pipeline.creator field (account object) may lack type discriminator.
    type: "make_field_optional"
    schema: "account"
    field: "type"

  - name: "Add discriminator mapping for pipeline_trigger"
    reason: |
      The API returns trigger objects with concrete types (pipeline_trigger_push,
      pipeline_trigger_manual) but the OpenAPI spec only defines pipeline_trigger
      as a base type without discriminator mapping. The Rust generator needs the
      mapping to properly deserialize the polymorphic types.

      The schema inherits from 'object' with a discriminator on 'type', but the
      mapping is missing, so deserialization fails when the SDK encounters a
      'pipeline_trigger_push' or 'pipeline_trigger_manual' type value.
    type: "add_discriminator_mapping"
    schema: "pipeline_trigger"
    propertyName: "type"
    mapping:
      "pipeline_trigger_push": "#/components/schemas/pipeline_trigger_push"
      "pipeline_trigger_manual": "#/components/schemas/pipeline_trigger_manual"

  - name: "Add name field to pipeline_trigger base schema"
    reason: |
      The API returns trigger objects with a 'name' field (e.g., {"type": "pipeline_trigger_push", "name": "PUSH"}).
      The schema needs to include this field so the Rust discriminated enum can properly deserialize it.
    type: "add_property"
    schema: "pipeline_trigger"
    property: "name"
    spec:
      type: "string"
      description: "The name of the trigger (e.g., PUSH for push triggers, MANUAL for manual triggers)"

  - name: "Add discriminator mapping for pipeline_state_completed_result"
    reason: |
      The API returns pipeline state result objects with concrete types (pipeline_state_completed_failed,
      pipeline_state_completed_successful, etc.) but the OpenAPI spec only defines pipeline_state_completed_result
      as a base type without discriminator mapping.

      The schema needs discriminator mapping so the Rust generator can properly deserialize the polymorphic types.
    type: "add_discriminator_mapping"
    schema: "pipeline_state_completed_result"
    propertyName: "type"
    mapping:
      "pipeline_state_completed_failed": "#/components/schemas/pipeline_state_completed_failed"
      "pipeline_state_completed_successful": "#/components/schemas/pipeline_state_completed_successful"
      "pipeline_state_completed_stopped": "#/components/schemas/pipeline_state_completed_stopped"
      "pipeline_state_completed_error": "#/components/schemas/pipeline_state_completed_error"
      "pipeline_state_completed_expired": "#/components/schemas/pipeline_state_completed_expired"

  - name: "Add name field to pipeline_state_completed_result base schema"
    reason: |
      The API returns result objects with a 'name' field (e.g., {"type": "pipeline_state_completed_failed", "name": "FAILED"}).
      The schema needs to include this field so the Rust discriminated enum can properly deserialize it.
    type: "add_property"
    schema: "pipeline_state_completed_result"
    property: "name"
    spec:
      type: "string"
      description: "The name of the result (e.g., FAILED, SUCCESSFUL, STOPPED, ERROR, EXPIRED)"

  - name: "Fix Pipeline.target to use concrete types"
    reason: |
      The Pipeline schema's target field currently references the empty
      pipeline_target base type, causing the generator to create enum variants
      without fields.

      Change it to use oneOf with the concrete types (pipeline_ref_target,
      pipeline_commit_target, pipeline_pullrequest_target) and add a discriminator
      mapping. This allows the generator to properly handle the discriminated union
      with all fields in the SDK's Pipeline.target field.
    type: "fix_pipeline_target"
