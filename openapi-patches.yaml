# OpenAPI Specification Patches
#
# This file contains patches to work around inconsistencies between the
# Bitbucket Cloud OpenAPI specification and the actual API behavior.
#
# Each patch is applied to the OpenAPI spec before code generation.
patches:
  - name: "Fix comment_resolution required type field"
    reason: |
      The API returns empty objects {} without the 'type' field for comments
      that don't have a resolution, but the OpenAPI spec declares 'type' as
      required. This causes deserialization errors.

      Issue: "error: parse error during list pull request comments: missing
      field `type` at line 1 column 4643"
    type: "make_field_optional"
    schema: "comment_resolution"
    field: "type"

  - name: "Fix object required type field"
    reason: |
      The API returns parent comment objects without the 'type' field. Parent
      comments in pullrequest_comment.parent only include 'id' and 'links'
      fields, but they inherit from 'object' schema which declares 'type' as
      required with a discriminator. Making the discriminator optional allows
      deserialization of partial objects.

      Issue: "error: parse error during list pull request comments pagination:
      missing field `type` at line 1 column 40305"
    type: "make_field_optional"
    schema: "object"
    field: "type"

  - name: "Add discriminator mapping for pipeline_target"
    reason: |
      The OpenAPI spec defines pipeline_target with a discriminator on the
      'type' field, but doesn't map discriminator values to concrete types.
      This prevents the code generator from properly supporting polymorphic
      deserialization of pipeline targets (pipeline_ref_target,
      pipeline_commit_target, etc.).

      Adding the discriminator mapping allows the SDK to properly deserialize
      and serialize pipeline target variants based on the 'type' field value.
      This enables using the SDK method create_pipeline_for_repository instead
      of bypassing with raw HTTP requests.
    type: "add_discriminator_mapping"
    schema: "pipeline_target"
    propertyName: "type"
    mapping:
      "pipeline_ref_target": "#/components/schemas/pipeline_ref_target"
      "pipeline_commit_target": "#/components/schemas/pipeline_commit_target"
